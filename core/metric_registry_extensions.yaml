version: marketplace_metric_registry.ozon_snapshot.v1
metrics:
  CURRENT_STOCK:
    provider_mappings:
      wb:
        status: EXECUTOR_OWNED
        source_id: wb_current_stocks
        fields:
          - quantity
          - nmId
          - warehouseName
        provider_aliases:
          - quantity
      ozon:
        status: MAPPED
        source_id: ozon_current_stocks
        fields:
          - stocks.present
          - stocks.reserved
          - stocks.type
          - sku
          - warehouse_ids
        provider_aliases:
          - present
          - reserved
    guardrail: >-
      For Ozon, stocks.present includes reserved units. CURRENT_STOCK therefore
      means sellable/available stock and is calculated as sum(present - reserved)
      across returned FBO/FBS buckets. Never expose sum(present) as available.

  OZON_FBO_AVAILABLE_STOCK:
    canonical_name_ru: Доступный остаток FBO Ozon
    abbreviation: null
    kind: BUSINESS
    units: [UNITS]
    aliases_ru:
      - остаток fbo ozon
      - остатки fbo ozon
      - доступный остаток fbo ozon
      - доступно fbo ozon
    aliases_en:
      - Ozon FBO available stock
      - Ozon FBO sellable stock
    semantic_target: {type: BUSINESS_METRIC, id: OZON_FBO_AVAILABLE_STOCK}
    provider_mappings:
      wb: {status: NOT_APPLICABLE, fields: []}
      ozon:
        status: MAPPED
        source_id: ozon_current_stocks
        fields: [stocks.present, stocks.reserved, stocks.type]
        provider_aliases: [present, reserved, type]
    guardrail: >-
      Only stock rows with type=fbo are included. Available units equal
      present - reserved; present itself includes the reserved quantity.

  OZON_FBO_RESERVED_STOCK:
    canonical_name_ru: Резерв FBO Ozon
    abbreviation: null
    kind: BUSINESS
    units: [UNITS]
    aliases_ru:
      - резерв fbo ozon
      - зарезервировано fbo ozon
      - резерв на fbo ozon
    aliases_en:
      - Ozon FBO reserved stock
    semantic_target: {type: BUSINESS_METRIC, id: OZON_FBO_RESERVED_STOCK}
    provider_mappings:
      wb: {status: NOT_APPLICABLE, fields: []}
      ozon:
        status: MAPPED
        source_id: ozon_current_stocks
        fields: [stocks.reserved, stocks.type]
        provider_aliases: [reserved, type]
    guardrail: >-
      Only stock rows with type=fbo are included. This is reserved quantity,
      not available stock.

  OZON_FBS_AVAILABLE_STOCK:
    canonical_name_ru: Доступный остаток FBS Ozon
    abbreviation: null
    kind: BUSINESS
    units: [UNITS]
    aliases_ru:
      - остаток fbs ozon
      - остатки fbs ozon
      - доступный остаток fbs ozon
      - доступно fbs ozon
      - остаток на складе продавца ozon
    aliases_en:
      - Ozon FBS available stock
      - Ozon FBS sellable stock
    semantic_target: {type: BUSINESS_METRIC, id: OZON_FBS_AVAILABLE_STOCK}
    provider_mappings:
      wb: {status: NOT_APPLICABLE, fields: []}
      ozon:
        status: MAPPED
        source_id: ozon_current_stocks
        fields: [stocks.present, stocks.reserved, stocks.type]
        provider_aliases: [present, reserved, type]
    guardrail: >-
      Only stock rows with type=fbs are included. Available units equal
      present - reserved; do not mix with FBO stock.

  OZON_FBS_RESERVED_STOCK:
    canonical_name_ru: Резерв FBS Ozon
    abbreviation: null
    kind: BUSINESS
    units: [UNITS]
    aliases_ru:
      - резерв fbs ozon
      - зарезервировано fbs ozon
      - резерв на fbs ozon
    aliases_en:
      - Ozon FBS reserved stock
    semantic_target: {type: BUSINESS_METRIC, id: OZON_FBS_RESERVED_STOCK}
    provider_mappings:
      wb: {status: NOT_APPLICABLE, fields: []}
      ozon:
        status: MAPPED
        source_id: ozon_current_stocks
        fields: [stocks.reserved, stocks.type]
        provider_aliases: [reserved, type]
    guardrail: >-
      Only stock rows with type=fbs are included. This is reserved quantity,
      not available stock.
  CURRENT_SELLING_PRICE:
    canonical_name_ru: Текущая цена продажи
    abbreviation: null
    kind: BUSINESS
    units:
      - RUB
    aliases_ru:
      - цена
      - текущая цена
      - цена товара
      - сколько стоит
      - стоимость товара сейчас
    aliases_en:
      - current price
      - selling price
    semantic_target:
      type: BUSINESS_METRIC
      id: CURRENT_SELLING_PRICE
    provider_mappings:
      wb:
        status: NOT_MAPPED
        fields: []
        provider_aliases: []
      ozon:
        status: MAPPED
        source_id: ozon_current_prices
        fields:
          - price.marketing_seller_price
          - price.currency_code
        provider_aliases:
          - marketing_seller_price
    guardrail: >-
      Seller-side current selling price after seller promotions. For Ozon the
      canonical provider field is marketing_seller_price. It must not be
      presented as a guaranteed final personalized buyer price because Ozon
      buyer-specific discounts or platform subsidies may change the checkout
      price. Historical price requires an approved historical source and must
      never be reconstructed from the current snapshot.


  OZON_BASE_PRICE:
    canonical_name_ru: Цена продавца до акций Ozon
    abbreviation: null
    kind: BUSINESS
    units: [RUB]
    aliases_ru:
      - цена продавца до акций ozon
      - цена до акций ozon
      - базовая цена ozon
    aliases_en:
      - Ozon seller price before promotions
      - Ozon base price
    semantic_target: {type: BUSINESS_METRIC, id: OZON_BASE_PRICE}
    provider_mappings:
      wb: {status: NOT_APPLICABLE, fields: []}
      ozon:
        status: MAPPED
        source_id: ozon_current_prices
        fields: [price.price, price.currency_code]
        provider_aliases: [price]
    guardrail: >-
      price.price is the seller price before Ozon promotions. Do not present it
      as the actual current buyer-facing selling price when
      marketing_seller_price is available.

  OZON_OLD_PRICE:
    canonical_name_ru: Зачёркнутая цена Ozon
    abbreviation: null
    kind: BUSINESS
    units: [RUB]
    aliases_ru:
      - зачеркнутая цена ozon
      - зачёркнутая цена ozon
      - старая цена ozon
      - цена до скидок ozon
    aliases_en:
      - Ozon old price
      - Ozon strikethrough price
    semantic_target: {type: BUSINESS_METRIC, id: OZON_OLD_PRICE}
    provider_mappings:
      wb: {status: NOT_APPLICABLE, fields: []}
      ozon:
        status: MAPPED
        source_id: ozon_current_prices
        fields: [price.old_price, price.currency_code]
        provider_aliases: [old_price]
    guardrail: >-
      price.old_price is the strikethrough/reference price before discounts.
      It is not the current selling price.

  OZON_MIN_PRICE:
    canonical_name_ru: Минимально допустимая цена Ozon
    abbreviation: null
    kind: BUSINESS
    units: [RUB]
    aliases_ru:
      - минимальная цена ozon
      - минимально допустимая цена ozon
      - минимальный порог цены ozon
    aliases_en:
      - Ozon minimum price
      - Ozon minimum allowed price
    semantic_target: {type: BUSINESS_METRIC, id: OZON_MIN_PRICE}
    provider_mappings:
      wb: {status: NOT_APPLICABLE, fields: []}
      ozon:
        status: MAPPED
        source_id: ozon_current_prices
        fields: [price.min_price, price.currency_code]
        provider_aliases: [min_price]
    guardrail: >-
      price.min_price is the configured minimum price threshold accepted for
      seller pricing. It is not the current selling price and must not be
      substituted for marketing_seller_price.
