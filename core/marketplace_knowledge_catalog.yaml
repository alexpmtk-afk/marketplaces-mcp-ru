metrics:
  WB_SELLER_PRICE_BEFORE_DISCOUNT:
    marketplace: wb
    label_ru: "Цена продавца до скидки"
    definition_ru: "Цена, установленная продавцом до применения скидки продавца."
    semantic_status: verified
    unit: RUB
    dimensions: [product, size, current_snapshot]
    aliases_ru: ["цена до скидки", "цена продавца до скидки", "базовая цена продавца"]
    aliases_en: ["seller price before discount"]
    historical_names: []
    provider_binding:
      source_id: wb_current_prices
      field_path: price
    source_refs: [wb_seller_price_help_20260518, wb_prices_api_20260923]
    source_checked_at: "2026-09-23"

  WB_SELLER_PRICE_AFTER_DISCOUNT:
    marketplace: wb
    label_ru: "Цена со скидкой продавца"
    definition_ru: "Цена товара после применения скидки продавца, без утверждения о персональной итоговой цене конкретного покупателя."
    semantic_status: verified
    unit: RUB
    dimensions: [product, size, current_snapshot]
    aliases_ru: ["цена со скидкой", "цена после скидки продавца", "цена со скидкой продавца"]
    aliases_en: ["seller discounted price"]
    historical_names: []
    provider_binding:
      source_id: wb_current_prices
      field_path: discountedPrice
    source_refs: [wb_seller_price_help_20260518, wb_prices_api_20260923]
    source_checked_at: "2026-09-23"

  WB_CLUB_PRICE_AFTER_DISCOUNT:
    marketplace: wb
    label_ru: "Цена со скидкой для WB Клуба"
    definition_ru: "Цена, получившаяся после применения установленной продавцом скидки WB Клуба к цене товара."
    semantic_status: verified
    unit: RUB
    dimensions: [product, size, current_snapshot]
    aliases_ru: ["цена для wb клуба", "цена wb клуб", "клубная цена", "цена со скидкой для wb клуба"]
    aliases_en: ["wb club discounted price", "club discounted price"]
    historical_names: []
    provider_binding:
      source_id: wb_current_prices
      field_path: clubDiscountedPrice
    source_refs: [wb_seller_price_help_20260518, wb_prices_api_20260923]
    source_checked_at: "2026-09-23"

  WB_CURRENT_STOCK:
    metric_id: CURRENT_STOCK
    marketplace: wb
    label_ru: "Текущие остатки на складах WB"
    definition_ru: "Количество единиц товара в текущем снимке остатков на складах Wildberries. Для выбранной области итог считается как сумма поля quantity по возвращённым строкам размера и склада."
    semantic_status: verified
    unit: UNITS
    dimensions: [product, size, warehouse, current_snapshot]
    aliases_ru: ["текущие остатки wb", "остатки на складах wb", "остатки wildberries"]
    aliases_en: ["current WB warehouse inventory", "current Wildberries stock"]
    historical_names: []
    provider_binding:
      source_id: wb_current_stocks
      field_path: quantity
    source_refs: [wb_current_stock_api_20260923, wb_warehouse_remains_release_20250313]
    source_checked_at: "2026-09-23"
    temporal_rule: "Только текущий день; исторический остаток должен использовать отдельный исторический источник."
    live_evidence:
      checked_at: "2026-09-23"
      cabinets:
        - cabinet: wb_novokshenov
          nm_id: "507763296"
          source_operation: wb_analytics_stocks_wb_warehouses
          result: PASS
        - cabinet: wb_laser_master
          nm_id: "392023986"
          source_operation: wb_analytics_stocks_wb_warehouses
          result: PASS

  WB_SALES:
    metric_id: SALES
    marketplace: wb
    label_ru: "Продажи"
    definition_ru: "Продажи из полностью покрытого еженедельного финансового отчёта WB: строки с docTypeName=Продажа; дата операции saleDt; количество quantity и сумма retailAmount. Возвраты считаются отдельным bucket."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, product, sale_date, operation_type]
    aliases_ru: ["продажи", "реализация", "продано"]
    aliases_en: ["sales", "sold"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [docTypeName, saleDt, quantity, retailAmount]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"
    formula_rule: "Продажа определяется значением docTypeName=Продажа; quantity и retailAmount не смешиваются с возвратами до отдельного расчёта bucket."

  WB_RETURNS:
    metric_id: RETURNS
    marketplace: wb
    label_ru: "Возвраты"
    definition_ru: "Возвраты из полностью покрытого еженедельного финансового отчёта WB: строки с docTypeName=Возврат; дата операции saleDt; количество quantity и сумма retailAmount. Знак суммы сам по себе не используется для определения возврата."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, product, sale_date, operation_type]
    aliases_ru: ["возвраты", "возвращено"]
    aliases_en: ["returns", "returned"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [docTypeName, saleDt, quantity, retailAmount]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"
    formula_rule: "Возврат определяется значением docTypeName=Возврат; нельзя классифицировать возврат только по знаку retailAmount."

  WB_LOGISTICS_COST:
    metric_id: LOGISTICS_COST
    marketplace: wb
    label_ru: "Расходы на логистику"
    definition_ru: "Логистические компоненты финансового отчёта WB. Денежные deliveryService и rebillLogisticCost учитываются отдельно; deliveryAmount и returnAmount являются логистическими счётчиками и не равны количеству продаж или возвратов товара."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, warehouse, operation_type]
    aliases_ru: ["логистика", "расходы на логистику", "стоимость логистики"]
    aliases_en: ["logistics cost", "delivery cost"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [deliveryAmount, returnAmount, deliveryService, rebillLogisticCost]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"
    formula_rule: "deliveryService и rebillLogisticCost не объединяются молча; счётчики deliveryAmount/returnAmount остаются отдельными."

  WB_PENALTIES:
    metric_id: PENALTIES
    marketplace: wb
    label_ru: "Штрафы"
    definition_ru: "Сумма штрафов, отражённая в поле penalty финансового отчёта WB; bonusTypeName и sellerOperName используются как контекст причины/операции."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, operation_type, reason]
    aliases_ru: ["штрафы", "штраф"]
    aliases_en: ["penalties", "fines"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [penalty, bonusTypeName, sellerOperName]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"
    formula_rule: "penalty суммируется в знаке отчёта; знак самостоятельно не переосмысливается."

  WB_STORAGE_COST:
    metric_id: STORAGE_COST
    marketplace: wb
    label_ru: "Платное хранение"
    definition_ru: "Сумма платного хранения, отражённая в поле paidStorage финансового отчёта WB."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, report_period]
    aliases_ru: ["платное хранение", "стоимость хранения"]
    aliases_en: ["paid storage", "storage cost"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [paidStorage]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"

  WB_ACCEPTANCE_COST:
    metric_id: ACCEPTANCE_COST
    marketplace: wb
    label_ru: "Платная приёмка"
    definition_ru: "Сумма платной приёмки, отражённая в поле paidAcceptance финансового отчёта WB."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, report_period]
    aliases_ru: ["платная приёмка", "платная приемка", "стоимость приёмки"]
    aliases_en: ["paid acceptance", "acceptance cost"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [paidAcceptance]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"

  WB_DEDUCTIONS_ADJUSTMENTS:
    metric_id: DEDUCTIONS_ADJUSTMENTS
    marketplace: wb
    label_ru: "Удержания и корректировки"
    definition_ru: "Компоненты deduction и additionalPayment финансового отчёта WB с контекстом bonusTypeName. Компоненты показываются отдельно и не неттируются без утверждённого правила."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, operation_type, reason]
    aliases_ru: ["удержания", "корректировки", "доплаты"]
    aliases_en: ["deductions", "adjustments"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [deduction, additionalPayment, bonusTypeName]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"

  WB_COMMISSION_REWARD_KNOWLEDGE:
    metric_id: WB_COMMISSION_REWARD
    marketplace: wb
    label_ru: "Комиссия и вознаграждение Wildberries"
    definition_ru: "Набор полей финансового отчёта WB для комиссии/вознаграждения. Денежное вознаграждение определяется утверждённым executor по vw и vwNds; commissionPercent, kvwBase и kvw являются ставочными/процентными полями и не превращаются в деньги по догадке."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, sale_date, operation_type]
    aliases_ru: ["комиссия wildberries", "вознаграждение wildberries", "комиссия wb"]
    aliases_en: ["Wildberries commission", "WB reward"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [commissionPercent, kvwBase, kvw, ppvzSalesCommission, vw, vwNds, forPay]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"
    formula_rule: "Процентные/ставочные поля не используются как денежная сумма без отдельного утверждённого правила."

  WB_ACQUIRING_PAYMENT_PROCESSING:
    metric_id: ACQUIRING_PAYMENT_PROCESSING
    marketplace: wb
    label_ru: "Эквайринг и обработка платежей"
    definition_ru: "Издержки на приём платежей в еженедельном финансовом отчёте WB: acquiringFee — сумма, acquiringPercent — процент, paymentProcessing — тип платежа/комиссии, acquiringBank — банк."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, sale_date, bank, payment_type]
    aliases_ru: ["эквайринг", "обработка платежей", "комиссия за организацию платежа"]
    aliases_en: ["acquiring", "payment processing"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [acquiringFee, acquiringPercent, paymentProcessing, acquiringBank]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415]
    source_checked_at: "2026-09-23"
    temporal_rule: "Еженедельный acquiringFee не выдаётся за окончательный месячный acquiring expense."

  WB_ORDERS:
    metric_id: ORDERS
    marketplace: wb
    label_ru: "Оперативные заказы Wildberries"
    definition_ru: "Оперативные строки заказов WB за выбранный календарный день. В текущем executor строки isCancel=true исключаются; количество — число оставшихся строк, сумма — сумма finishedPrice. Это не финансовая выручка и не доказанный полный поток абсолютно всех оформленных заказов."
    semantic_status: verified
    unit: UNITS_OR_RUB
    dimensions: [order_row, order_date, cabinet]
    aliases_ru: ["заказы", "оперативные заказы", "количество заказов", "сумма заказов"]
    aliases_en: ["orders", "operational orders", "order count", "order amount"]
    historical_names: []
    provider_binding:
      source_id: wb_stats_orders
      field_paths: [date, isCancel, finishedPrice]
    provider_raw_fields: [date, isCancel, finishedPrice]
    source_refs: [wb_reports_api_20260923]
    source_checked_at: "2026-09-23"
    formula_rule: "UNITS=count(rows where isCancel=false for requested day); AMOUNT_RUB=sum(finishedPrice for the same rows)."
    guardrail: "Не выдавать за продажи, выручку, выплаты или полный поток всех оформленных заказов."

  WB_CURRENT_FBS_STOCK:
    metric_id: CURRENT_FBS_STOCK
    marketplace: wb
    label_ru: "Текущие остатки FBS на складе продавца"
    definition_ru: "Текущий остаток товара на складах продавца WB по схеме FBS. Executor разрешает nmId в chrtId размеров, получает stocks для выбранных seller warehouses и суммирует amount. Это не остаток на складах Wildberries."
    semantic_status: verified
    unit: UNITS
    dimensions: [product, size, seller_warehouse, current_snapshot]
    aliases_ru: ["остаток fbs", "остатки fbs", "остаток на складе продавца"]
    aliases_en: ["current FBS stock", "seller warehouse stock"]
    historical_names: []
    provider_binding:
      source_id: wb_fbs_stock
      field_paths: [chrtId, amount]
    provider_raw_fields: [chrtId, amount]
    provider_operation: wb_post_api_stocks_warehouseid
    source_refs: [wb_seller_stocks_api_20260923]
    source_checked_at: "2026-09-23"
    temporal_rule: "Только текущий seller-warehouse snapshot; не использовать как исторический остаток или остаток на складах WB."

  WB_AD_VIEWS:
    metric_id: AD_VIEWS
    marketplace: wb
    label_ru: "Показы рекламы"
    definition_ru: "Количество показов в статистике рекламных кампаний WB."
    semantic_status: verified
    unit: COUNT
    dimensions: [campaign, date, advertising_attribution]
    aliases_ru: ["показы рекламы", "рекламные показы"]
    aliases_en: ["ad views", "impressions"]
    historical_names: []
    provider_binding:
      source_id: wb_ads_data
      field_paths: [views]
    provider_raw_fields: [views]
    source_refs: [wb_promotion_api_20260923]
    source_checked_at: "2026-09-23"

  WB_AD_CLICKS:
    metric_id: AD_CLICKS
    marketplace: wb
    label_ru: "Клики по рекламе"
    definition_ru: "Количество кликов в статистике рекламных кампаний WB."
    semantic_status: verified
    unit: COUNT
    dimensions: [campaign, date, advertising_attribution]
    aliases_ru: ["клики по рекламе", "рекламные клики"]
    aliases_en: ["ad clicks", "clicks"]
    historical_names: []
    provider_binding:
      source_id: wb_ads_data
      field_paths: [clicks]
    provider_raw_fields: [clicks]
    source_refs: [wb_promotion_api_20260923]
    source_checked_at: "2026-09-23"

  WB_AD_CART_ADDS:
    metric_id: AD_CART_ADDS
    marketplace: wb
    label_ru: "Добавления в корзину из рекламы"
    definition_ru: "Добавления в корзину, атрибутированные рекламе WB; provider-поле atbs нормализуется в cart_adds."
    semantic_status: verified
    unit: COUNT
    dimensions: [campaign, date, advertising_attribution]
    aliases_ru: ["добавления в корзину из рекламы", "рекламные добавления в корзину"]
    aliases_en: ["ad cart adds", "cart adds"]
    historical_names: []
    provider_binding:
      source_id: wb_ads_data
      field_paths: [cart_adds]
    provider_raw_fields: [atbs]
    source_refs: [wb_promotion_api_20260923]
    source_checked_at: "2026-09-23"

  WB_AD_ORDERS:
    metric_id: AD_ORDERS
    marketplace: wb
    label_ru: "Рекламные заказы"
    definition_ru: "Количество заказов, атрибутированных рекламной статистикой WB; provider-поле orders нормализуется в ad_orders. Это не полный поток заказов магазина."
    semantic_status: verified
    unit: COUNT
    dimensions: [campaign, date, advertising_attribution]
    aliases_ru: ["рекламные заказы", "заказы из рекламы"]
    aliases_en: ["ad orders", "attributed orders"]
    historical_names: []
    provider_binding:
      source_id: wb_ads_data
      field_paths: [ad_orders]
    provider_raw_fields: [orders]
    source_refs: [wb_promotion_api_20260923]
    source_checked_at: "2026-09-23"
    guardrail: "Не подменять общей метрикой ORDERS."

  WB_AD_ADVERTISED_ITEMS:
    metric_id: AD_ADVERTISED_ITEMS
    marketplace: wb
    label_ru: "Рекламируемые единицы"
    definition_ru: "Количество рекламируемых единиц в статистике WB; provider-поле shks нормализуется в advertised_items."
    semantic_status: verified
    unit: COUNT
    dimensions: [campaign, date, advertising_attribution]
    aliases_ru: ["рекламируемые единицы", "рекламируемые товары"]
    aliases_en: ["advertised items"]
    historical_names: []
    provider_binding:
      source_id: wb_ads_data
