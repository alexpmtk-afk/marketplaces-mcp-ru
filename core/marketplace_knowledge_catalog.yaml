metrics:
  WB_SELLER_PRICE_BEFORE_DISCOUNT:
    marketplace: wb
    label_ru: "Цена продавца до скидки"
    definition_ru: "Цена, установленная продавцом до применения скидки продавца."
    semantic_status: verified
    unit: RUB
    dimensions: [product, size, current_snapshot]
    aliases_ru: ["цена до скидки", "цена продавца до скидки", "базовая цена продавца"]
    aliases_en: ["seller price before discount"]
    historical_names: []
    provider_binding:
      source_id: wb_current_prices
      field_path: price
    cabinet_binding:
      surface_ru: "Товары и цены → Цены и скидки"
      label_ru: "Цена продавца до скидки, ₽"
      scope_ru: "Цена, которую продавец устанавливает до применения своей скидки."
      equivalence_status: verified
      source_refs: [wb_seller_price_help_20260518]
    source_refs: [wb_seller_price_help_20260518, wb_prices_api_20260923]
    source_checked_at: "2026-09-23"

  WB_SELLER_PRICE_AFTER_DISCOUNT:
    marketplace: wb
    label_ru: "Цена со скидкой продавца"
    definition_ru: "Цена товара после применения скидки продавца, без утверждения о персональной итоговой цене конкретного покупателя."
    semantic_status: verified
    unit: RUB
    dimensions: [product, size, current_snapshot]
    aliases_ru: ["цена со скидкой", "цена после скидки продавца", "цена со скидкой продавца"]
    aliases_en: ["seller discounted price"]
    historical_names: []
    provider_binding:
      source_id: wb_current_prices
      field_path: discountedPrice
    cabinet_binding:
      surface_ru: "Товары и цены → Цены и скидки"
      label_ru: "Цена со скидкой, ₽"
      scope_ru: "Цена после применения скидки продавца; не является персональной итоговой ценой конкретного покупателя."
      equivalence_status: verified
      source_refs: [wb_seller_price_help_20260518]
    source_refs: [wb_seller_price_help_20260518, wb_prices_api_20260923]
    source_checked_at: "2026-09-23"

  WB_CLUB_PRICE_AFTER_DISCOUNT:
    marketplace: wb
    label_ru: "Цена со скидкой для WB Клуба"
    definition_ru: "Цена, получившаяся после применения установленной продавцом скидки WB Клуба к цене товара."
    semantic_status: verified
    unit: RUB
    dimensions: [product, size, current_snapshot]
    aliases_ru: ["цена для wb клуба", "цена wb клуб", "клубная цена", "цена со скидкой для wb клуба"]
    aliases_en: ["wb club discounted price", "club discounted price"]
    historical_names: []
    provider_binding:
      source_id: wb_current_prices
      field_path: clubDiscountedPrice
    cabinet_binding:
      surface_ru: "Товары и цены → Цены и скидки"
      label_ru: "Цена со скидкой для WB Клуба, ₽"
      scope_ru: "Цена товара после применения установленной продавцом скидки WB Клуба."
      equivalence_status: verified
      source_refs: [wb_seller_price_help_20260518]
    source_refs: [wb_seller_price_help_20260518, wb_prices_api_20260923]
    source_checked_at: "2026-09-23"

  WB_CURRENT_STOCK:
    metric_id: CURRENT_STOCK
    marketplace: wb
    label_ru: "Текущие остатки на складах WB"
    definition_ru: "Количество единиц товара в текущем снимке остатков на складах Wildberries. Для выбранной области итог считается как сумма поля quantity по возвращённым строкам размера и склада."
    semantic_status: verified
    unit: UNITS
    dimensions: [product, size, warehouse, current_snapshot]
    aliases_ru: ["текущие остатки wb", "остатки на складах wb", "остатки wildberries"]
    aliases_en: ["current WB warehouse inventory", "current Wildberries stock"]
    historical_names: []
    provider_binding:
      source_id: wb_current_stocks
      field_path: quantity
    cabinet_binding:
      surface_ru: "Товары и цены → карточка товара → Остатки"
      label_ru: "Остатки «Склад WB»"
      scope_ru: "Товары, физически находящиеся на складах Wildberries. В карточке товара этот bucket показывается отдельно от «Свой склад» и от «Товары в пути»."
      equivalence_status: verified
      source_refs: [wb_warehouse_stock_report_help_20260518]
      live_cabinet_observation: "2026-09-24: seller cabinet product panel uses exact label «Остатки “Склад WB”»."
    source_refs: [wb_current_stock_api_20260923, wb_warehouse_remains_release_20250313, wb_warehouse_stock_report_help_20260518]
    source_checked_at: "2026-09-24"
    temporal_rule: "Только текущий день; исторический остаток должен использовать отдельный исторический источник."
    live_evidence:
      checked_at: "2026-09-23"
      cabinets:
        - cabinet: wb_novokshenov
          nm_id: "507763296"
          source_operation: wb_analytics_stocks_wb_warehouses
          result: PASS
        - cabinet: wb_laser_master
          nm_id: "392023986"
          source_operation: wb_analytics_stocks_wb_warehouses
          result: PASS

  WB_SALES:
    metric_id: SALES
    marketplace: wb
    label_ru: "Продажи"
    definition_ru: "Продажи из полностью покрытого еженедельного финансового отчёта WB: строки с docTypeName=Продажа; дата операции saleDt; количество quantity и сумма retailAmount. Возвраты считаются отдельным bucket."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, product, sale_date, operation_type]
    aliases_ru: ["продажи", "реализация", "продано"]
    aliases_en: ["sales", "sold"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [docTypeName, saleDt, quantity, retailAmount]
    cabinet_binding:
      surface_ru: "Аналитика продавца → Лента заказов"
      label_ru: "Выкупы"
      scope_ru: "Ближайший кабинетный аналог, но не эквивалентный источник: «Выкупы» в «Ленте заказов» — статус заказов в кабинете, а SALES здесь — финансовые строки docTypeName=Продажа из еженедельного отчёта реализации с собственной датой операции saleDt."
      equivalence_status: partial
      source_refs: [wb_order_feed_help_20260731, wb_finance_reports_api_20260923]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415, wb_order_feed_help_20260731]
    source_checked_at: "2026-09-24"
    formula_rule: "Продажа определяется значением docTypeName=Продажа; quantity и retailAmount не смешиваются с возвратами до отдельного расчёта bucket."
    guardrail: "Не приравнивать финансовые строки «Продажа» к счётчику «Выкупы» в кабинете без отдельного правила периода и охвата."

  WB_RETURNS:
    metric_id: RETURNS
    marketplace: wb
    label_ru: "Возвраты"
    definition_ru: "Возвраты из полностью покрытого еженедельного финансового отчёта WB: строки с docTypeName=Возврат; дата операции saleDt; количество quantity и сумма retailAmount. Знак суммы сам по себе не используется для определения возврата."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, product, sale_date, operation_type]
    aliases_ru: ["возвраты", "возвращено"]
    aliases_en: ["returns", "returned"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [docTypeName, saleDt, quantity, retailAmount]
    cabinet_binding:
      surface_ru: "Аналитика продавца → Лента заказов"
      label_ru: "Возвраты"
      scope_ru: "Ближайший кабинетный аналог, но не эквивалентный источник: вкладка «Возвраты» показывает текущие статусы заказов в кабинете, а RETURNS здесь — финансовые строки docTypeName=Возврат из еженедельного отчёта реализации с собственной датой операции saleDt."
      equivalence_status: partial
      source_refs: [wb_order_feed_help_20260731, wb_finance_reports_api_20260923]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415, wb_order_feed_help_20260731]
    source_checked_at: "2026-09-24"
    formula_rule: "Возврат определяется значением docTypeName=Возврат; нельзя классифицировать возврат только по знаку retailAmount."
    guardrail: "Не приравнивать финансовые строки «Возврат» к счётчику «Возвраты» в кабинете без отдельного правила периода и охвата."

  WB_LOGISTICS_COST:
    metric_id: LOGISTICS_COST
    marketplace: wb
    label_ru: "Расходы на логистику"
    definition_ru: "Логистические компоненты финансового отчёта WB. Денежные deliveryService и rebillLogisticCost учитываются отдельно; deliveryAmount и returnAmount являются логистическими счётчиками и не равны количеству продаж или возвратов товара."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, warehouse, operation_type]
    aliases_ru: ["логистика", "расходы на логистику", "стоимость логистики"]
    aliases_en: ["logistics cost", "delivery cost"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [deliveryAmount, returnAmount, deliveryService, rebillLogisticCost]
    cabinet_binding:
      surface_ru: "Финансовые отчёты → Еженедельные"
      label_ru: "Стоимость логистики"
      scope_ru: "В кабинете это сводная сумма логистики за неделю. В детализации API денежные deliveryService и rebillLogisticCost и счётчики deliveryAmount/returnAmount остаются отдельными компонентами и не складываются вслепую."
      equivalence_status: partial
      source_refs: [wb_weekly_report_help_20260518]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415, wb_weekly_report_help_20260518]
    source_checked_at: "2026-09-24"
    formula_rule: "deliveryService и rebillLogisticCost не объединяются молча; счётчики deliveryAmount/returnAmount остаются отдельными."
    guardrail: "Не выдавать один из детальных компонентов или логистический счётчик за итоговую строку «Стоимость логистики» без утверждённой агрегации за тот же период."

  WB_PENALTIES:
    metric_id: PENALTIES
    marketplace: wb
    label_ru: "Штрафы"
    definition_ru: "Сумма штрафов, отражённая в поле penalty финансового отчёта WB; bonusTypeName и sellerOperName используются как контекст причины/операции."
    semantic_status: verified
    unit: RUB
    dimensions: [report_row, operation_type, reason]
    aliases_ru: ["штрафы", "штраф"]
    aliases_en: ["penalties", "fines"]
    historical_names: []
    provider_binding:
      source_id: wb_weekly_finance_main
      field_paths: [penalty, bonusTypeName, sellerOperName]
    cabinet_binding:
      surface_ru: "Финансовые отчёты → Еженедельные"
      label_ru: "Общая сумма штрафов"
      scope_ru: "Кабинет показывает сводную сумму штрафов за отчётную неделю. Поле penalty хранит детальные суммы, а bonusTypeName и sellerOperName — контекст причины/операции."
      equivalence_status: partial
      source_refs: [wb_weekly_report_help_20260518, wb_penalties_help_20260521]
    source_refs: [wb_finance_reports_api_20260923, wb_finance_reports_release_20260415, wb_weekly_report_help_20260518, wb_penalties_help_20260521]
    source_checked_at: "2026-09-24"
    formula_rule: "penalty суммируется в знаке отчёта; знак самостоятельно не переосмысливается."
    guardrail: "Не выдавать отдельную строку penalty за «Общую сумму штрафов» без агрегации за тот же отчётный период."

