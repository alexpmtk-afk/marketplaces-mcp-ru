version: 2026-09-15.v8
policy:
  fail_closed_on_unknown: true
  prefer_exact_field_reference: true
  current_state_must_not_be_inferred_from_weekly_archive: true

business_metrics:
  ORDERS:
    status: AVAILABLE_WITH_LIMITATION
    marketplace: wb
    source_id: wb_stats_orders
    data_class: PRELIMINARY_OPERATIONAL
    default_measure: BOTH
    allowed_measures: [UNITS, AMOUNT_RUB, BOTH]
    allowed_groupings: [TOTAL]
    product_filter_supported: false
    guardrail: Обычная метрика заказов использует оперативную статистику WB и не является полным потоком всех оформленных заказов.

routes:
  - id: ozon_any
    priority: 2000
    target_type: not_covered
    target_id: ozon_data
    match_any: [ozon, озон]

  - id: current_stock
    priority: 1950
    target_type: not_covered
    target_id: current_stock
    match_any: [остатки, остаток товара, складской остаток, остатки сейчас, текущие остатки, остаток сейчас, сколько осталось, остатки на сегодня]

  - id: current_fulfillment_configuration
    priority: 1950
    target_type: not_covered
    target_id: current_fulfillment_configuration
    match_any: [какая схема сейчас, схема отгрузки сейчас, схеме отгрузки сейчас, текущая схема отгрузки, настроена схема, текущая схема поставки]

  - id: current_warehouse_tariff
    priority: 1945
    target_type: inline_not_covered
    reason: Актуальные коэффициенты логистики/хранения и текущие тарифы склада нужно получать из актуального раздела тарифов Wildberries или подтверждённого live-источника. Исторические dlvPrc/warehouseLogisticsCoeff из еженедельного отчёта нельзя выдавать за текущий тариф.
    match_any: [актуальный коэффициент склада, актуальный коэффициент логистики, актуальный коэффициент хранения, текущий коэффициент склада, текущий коэффициент логистики, текущий коэффициент хранения, тариф склада сейчас, тариф логистики сейчас, тариф хранения сейчас, актуальный тариф склада, актуальный тариф логистики, актуальный тариф хранения]

  - id: advertising_performance
    priority: 1900
    target_type: capability
    target_id: advertising_performance
    match_any: [реклама, рекламная кампания, показы, клики, рекламные расходы, рекламный расход, дрр, ctr, cpc, cpo, roas]

  - id: detailed_storage_calculation
    priority: 1850
    target_type: not_covered
    target_id: detailed_storage_calculation
    match_any: [как рассчитано хранение, расчет хранения по дням, расчёт хранения по дням, почему начислили хранение, детализация хранения]

  - id: detailed_acceptance_operations
    priority: 1850
    target_type: not_covered
    target_id: detailed_acceptance_operations
    match_any: [как рассчитана приемка, как рассчитана приёмка, детализация приемки, детализация приёмки, почему начислили приемку, почему начислили приёмку]

  - id: current_state_generic
    priority: 1800
    target_type: inline_not_covered
    reason: Еженедельный архив отражает исторические операции и не подтверждает текущее состояние на данный момент.
    match_any: [сейчас, на данный момент, сегодня, текущий, текущая, текущие, текущего]

  - id: report_period_and_identity
    priority: 1600
    target_type: capability
    target_id: report_period_and_identity
    match_any: [еженедельный отчет, еженедельный отчёт, отчет реализации, отчёт реализации, номер отчета, номер отчёта, период отчета, период отчёта, валюта отчета, валюта отчёта]

  - id: order_context_attribute
    priority: 1550
    target_type: capability
    target_id: order_context_attribute
    match_any: [дата заказа, время заказа, номер заказа, uid заказа, orderdt, orderuid, orderid, srid]

  - id: complete_order_flow
    priority: 1520
    target_type: not_covered
    target_id: all_orders_placed
    match_any: [полный поток заказов, полная история заказов, все оформленные заказы, все заказы без исключения, абсолютно все заказы, включая неоплаченные заказы, включая заказы с неподтвержденной оплатой]

  - id: orders_business_metric
    priority: 1500
    target_type: business_metric
    target_id: ORDERS
    match_any: [сколько заказов, сумма заказов, количество заказов, заказы за, заказов за, заказы, заказов, заказали, заказано]

  - id: observed_fulfillment_method
    priority: 1450
    target_type: capability
    target_id: observed_fulfillment_method
    match_any: [схема отгрузки, схеме отгрузки, модель отгрузки, схема поставки, схеме поставки, схеме отгружался, схеме отгружалась, схеме отгружалось, схеме отгружается, как отгружался, как отгружалась, как отгружалось, как отгружается, deliverymethod, fbs, fbw, fbo, со склада продавца, со склада wildberries, со склада вайлдберриз]

  - id: warehouse_tariff_context
    priority: 1425
    target_type: capability
    target_id: warehouse_tariff_context
    match_any: [коэффициент логистики, коэффициент склада, коэффициент хранения, зафиксированный коэффициент, фиксированный коэффициент склада, тариф склада, тариф логистики, период фиксации тарифа, warehouselogisticscoeff, dlvprc]

  - id: logistics
    priority: 1400
    target_type: capability
    target_id: logistics
    match_any: [логистика, обратная логистика, возвратная логистика, стоимость доставки, доставка покупателю, доставка к клиенту, ребилл логистики]

  - id: penalties
    priority: 1380
    target_type: capability
    target_id: penalties
    match_any: [штраф, штрафы, сумма штрафов, причина штрафа, за что штраф]

  - id: storage_charge
    priority: 1360
    target_type: capability
    target_id: storage_charge
    match_any: [платное хранение, списали за хранение, начислили за хранение, сумма хранения, стоимость хранения]

  - id: acceptance_charge
    priority: 1340
    target_type: capability
    target_id: acceptance_charge
    match_any: [платная приемка, платная приёмка, списали за приемку, списали за приёмку, сумма приемки, сумма приёмки]

  - id: deductions_and_adjustments
    priority: 1320
    target_type: capability
    target_id: deductions_and_adjustments
    match_any: [удержание, удержания, удержали, доплата, доплаты, корректировка, корректировки, дополнительная выплата]

  - id: commission_rate_not_money
    priority: 1315
    target_type: inline_not_covered
    reason: Процент комиссии/кВВ присутствует в исторических строках отчёта, но это не денежная сумма комиссии. Отдельный исполнитель ставок ещё не утверждён; нельзя подменять процент денежным расчётом vw/vwNds.
    match_any: [процент комиссии, ставка комиссии, размер комиссии в процентах, квв, kvw, kvwbase, commissionpercent]

  - id: commission_and_wb_reward
    priority: 1300
    target_type: capability
    target_id: commission_and_wb_reward
    match_any: [комиссия wildberries, комиссия вайлдберриз, комиссия wb, сумма комиссии, сколько комиссии, вознаграждение wildberries, вознаграждение вайлдберриз, сумма вознаграждения]

  - id: final_acquiring_expenses
    priority: 1290
    target_type: inline_not_covered
    reason: Окончательные издержки на приём платежей подтверждаются отдельным месячным Отчётом об издержках на приём платежей. Его данных сейчас нет в канонической базе; еженедельный acquiringFee нельзя выдавать за окончательную сумму.
    match_any: [окончательный эквайринг, финальный эквайринг, фактические издержки на прием платежей, фактические издержки на приём платежей, окончательные издержки на прием платежей, окончательные издержки на приём платежей, отчет об издержках на прием платежей, отчёт об издержках на приём платежей]

  - id: acquiring_and_payment_processing
    priority: 1280
    target_type: capability
    target_id: acquiring_and_payment_processing
    match_any: [эквайринг, комиссия эквайринга, обработка платежа, платежный процессинг, платёжный процессинг, acquiring]

  - id: pickup_point_context
    priority: 1260
    target_type: capability
    target_id: pickup_point_context
    match_any: [пвз, пункт выдачи, офис пвз, вознаграждение пвз]

  - id: promotions_loyalty_cashback
    priority: 1240
    target_type: capability
    target_id: promotions_loyalty_cashback
    match_any: [промокод, скидка продавца, скидка wb, скидка wildberries, лояльность, кешбэк, кэшбэк, cashback, spp, акция продавца]

  - id: b2b
    priority: 1220
    target_type: capability
    target_id: b2b
    match_any: [b2b, продажа юрлицу, покупатель юрлицо, инн покупателя, оптовая скидка]

  - id: traceability_and_marking
    priority: 1200
    target_type: capability
    target_id: traceability_and_marking
    match_any: [киз, маркировка, код маркировки, декларация, номер декларации, штрихкод единицы, stickerid, shkid]

  - id: geography
    priority: 1180
    target_type: capability
    target_id: geography
    match_any: [география, регион операции, страна операции, страна продажи, где покупатель, регион покупателя]

  - id: product_identity
    priority: 1160
    target_type: capability
    target_id: product_identity
    match_any: [артикул wb, артикул wildberries, артикул вайлдберриз, артикул продавца, nm id, nmid, vendorcode, бренд, название товара, размер товара, баркод товара, sku]

  - id: sale_and_return_operations
    priority: 1100
    target_type: capability
    target_id: sale_and_return_operations
    match_any: [продажа, продажи, продаж, выкуп, выкупы, возврат, возвраты, реализация, сумма продаж, количество продаж]
