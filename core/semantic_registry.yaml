    business_metric: SALES
    measure: UNITS
    status: APPROVED
    source_id: wb_stats_sales
    event_date_field: date
    timezone: Europe/Moscow
    formula: COUNT(saleID startswith 'S') - COUNT(saleID startswith 'R')
    dedup_key: [saleID]
    quality: preliminary_operational
  SALES_NET_AMOUNT_RUB:
    marketplace: wb
    business_metric: SALES
    measure: AMOUNT_RUB
    status: APPROVED
    source_id: wb_stats_sales
    event_date_field: date
    timezone: Europe/Moscow
