name: Recovery fix client blob

on:
  push:
    branches:
      - recovery/provesti-testirovanie-20260830

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair transfer typo if present
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/client.py')
          s = p.read_text(encoding='utf-8')
          bad = 'TOKEN_EXPIRY_SKEW"))'
          good = 'TOKEN_EXPIRY_SKEW))'
          if bad in s:
              p.write_text(s.replace(bad, good), encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- core/client.py; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/client.py
          git commit -m 'fix: repair client transfer typo'
          git push
