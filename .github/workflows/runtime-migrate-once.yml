name: Ozon runtime migration once

on:
  push:
    branches:
      - api-map/2026-09-01
    paths:
      - .github/workflows/runtime-migrate-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install migration test dependencies
        run: python -m pip install 'pyyaml>=6,<7' pytest

      - name: Apply targeted Ozon runtime migration
        run: python scripts/runtime_migrate_ozon_20260907_once.py

      - name: Validate migrated runtime contracts
        run: |
          python -m pytest -q tests/test_paginate.py tests/test_ozon_runtime_migrations.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          raw = yaml.safe_load(Path('ozon_mcp/endpoints.yaml').read_text(encoding='utf-8'))
          ids = {x['operation_id'] for x in raw['endpoints']}
          assert 'ozon_finance_transactions' not in ids
          assert 'ozon_finance_totals' not in ids
          assert {'ozon_finance_accrual_postings','ozon_finance_accrual_types','ozon_finance_accrual_by_day'} <= ids
          PY
          git diff --check

      - name: Commit migration and remove one-shot helpers
        run: |
          git config user.name 'api-runtime-migration-bot'
          git config user.email 'api-runtime-migration-bot@users.noreply.github.com'
          git rm .github/workflows/runtime-migrate-once.yml scripts/runtime_migrate_ozon_20260907_once.py
          git add core/paginate.py ozon_mcp/endpoints.yaml ozon_mcp/server.py ozon_mcp/workflows.yaml tests/test_paginate.py tests/test_ozon_runtime_migrations.py
          git commit -m 'fix(ozon): migrate shutdown posting and finance routes'
          git push origin HEAD:api-map/2026-09-01
