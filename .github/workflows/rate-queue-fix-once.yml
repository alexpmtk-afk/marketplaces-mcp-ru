name: Interactive rate-limit fix once

on:
  push:
    branches:
      - api-map/2026-09-01
    paths:
      - .github/workflows/rate-queue-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Apply interactive limiter fix
        run: python scripts/runtime_fix_rate_queue_20260907_once.py

      - name: Validate limiter behavior and full client hardening
        run: |
          python -m pytest -q tests/test_client_hardening.py tests/test_rate_limit_env.py tests/test_mock.py
          python - <<'PY'
          from pathlib import Path
          client = Path('core/client.py').read_text(encoding='utf-8')
          assert '.rate_controller.acquire(' not in client
          assert '.rate_controller.try_acquire(' in client
          assert 'No future slot was reserved' in client
          PY
          git diff --check

      - name: Commit fix and remove one-shot helpers
        run: |
          git config user.name 'rate-limit-fix-bot'
          git config user.email 'rate-limit-fix-bot@users.noreply.github.com'
          git rm .github/workflows/rate-queue-fix-once.yml scripts/runtime_fix_rate_queue_20260907_once.py
          git add core/client.py tests/test_client_hardening.py
          git commit -m 'fix(rate-limit): fail fast without reserving queue debt'
          git push origin HEAD:api-map/2026-09-01
