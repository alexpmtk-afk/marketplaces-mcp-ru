name: Finalize Marketplaces Bridge v1 once

on:
  push:
    branches:
      - bridge-v1-final-20260914
    paths:
      - scripts/finalize_google_drive_bridge_v1.py
      - .github/workflows/bridge-v1-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge-v1-final-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic finalization
        run: python scripts/finalize_google_drive_bridge_v1.py
      - name: Validate final runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile core/archive_google.py scripts/finalize_google_drive_bridge_v1.py
          grep -Fq 'BRIDGE_RELEASE_V1 = "1.0.0"' core/archive_google.py
          grep -Fq 'BRIDGE_RELEASE_MISMATCH' core/archive_google.py
          grep -Fq 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_PROTOCOL=v1' .env.example
          grep -Fq 'FINAL CLIENT CONTRACT' docs/SHARED_GOOGLE_DRIVE_BRIDGE_V1.md
          test -f docs/MARKETPLACES_BRIDGE_V1_STATUS.md
          if grep -R -n -E 'NOT_IMPLEMENTED|TODO:.*Bridge v1|candidate `bridge_release=1\.0\.0-alpha' core/archive_google.py docs/SHARED_GOOGLE_DRIVE_BRIDGE_V1.md docs/MARKETPLACES_BRIDGE_V1_STATUS.md; then
            echo 'unfinished Bridge v1 marker found'
            exit 1
          fi
          echo MARKETPLACES_BRIDGE_V1_STATIC=PASS
      - name: Install and run repository tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if test -f pyproject.toml; then python -m pip install -e '.[dev]' || python -m pip install -e .; fi
          python -m pytest -q
      - name: Commit generated final files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/archive_google.py .env.example docs/SHARED_GOOGLE_DRIVE_BRIDGE_V1.md docs/MARKETPLACES_BRIDGE_V1_STATUS.md tests/test_archive_google_bridge_v1.py
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'bridge v1: finalize Marketplaces client contract 1.0.0'
            git push origin HEAD:bridge-v1-final-20260914
          fi
