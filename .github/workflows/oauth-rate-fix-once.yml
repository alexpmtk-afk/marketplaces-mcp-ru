name: OAuth rate namespace fix once

on:
  push:
    branches:
      - api-map/2026-09-01
    paths:
      - .github/workflows/oauth-rate-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and tests
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Apply OAuth rate namespace fix
        run: python scripts/oauth_rate_namespace_fix_20260907_once.py

      - name: Validate full offline suite and invariants
        run: |
          env -u OZON_CLIENT_ID -u OZON_API_KEY -u WB_API_TOKEN python -m pytest tests/ -q
          python - <<'PY'
          from pathlib import Path
          client = Path('core/client.py').read_text(encoding='utf-8')
          tests = Path('tests/test_perf_oauth.py').read_text(encoding='utf-8')
          assert 'cabinet_key=f"{key}:oauth"' in client
          assert '.rate_controller.acquire(' not in client
          assert 'test_oauth_token_and_api_use_separate_rate_limit_namespaces' in tests
          PY
          git diff --check

      - name: Commit fix and remove one-shot helpers
        run: |
          git config user.name 'oauth-rate-fix-bot'
          git config user.email 'oauth-rate-fix-bot@users.noreply.github.com'
          git rm .github/workflows/oauth-rate-fix-once.yml scripts/oauth_rate_namespace_fix_20260907_once.py
          git add core/client.py tests/test_perf_oauth.py
          git commit -m 'fix(oauth): isolate token rate-limit namespace'
          git push origin HEAD:api-map/2026-09-01
