name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Native GitHub dependency review
        id: native
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fallback dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -c "import tomllib,pathlib;print(chr(10).join(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']))" > requirements-audit.txt
          cat requirements-audit.txt
          pip-audit --strict -r requirements-audit.txt
      - name: Report unavailable native dependency review
        if: steps.native.outcome != 'success'
        run: echo '::warning::GitHub Dependency Review is unavailable for this repository; strict pip-audit fallback passed.'
