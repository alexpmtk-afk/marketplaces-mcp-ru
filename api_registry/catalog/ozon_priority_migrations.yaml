project_catalog_quality_findings:
  - finding: Several auto-imported Ozon operations are explicitly marked UNVERIFIED in ozon_mcp/endpoints.yaml.
    implication: They must not be treated as authoritative contracts until matched to current OpenAPI.
  - finding: HTTP POST is not evidence of a mutating Ozon operation.
    examples:
      - old /v1/delivery-method/list is classified write while its v2 replacement is read
      - old /v2/chat/list is classified write while /v3/chat/list is read
      - v2 draft info/timeslot/status methods are read-semantic although some implementation entries are classified write
    implication: safety classification needs a semantic audit, not HTTP-verb inference.

rules:
  - Shutdown-passed endpoints must become ineligible for generic selection before any production deletion.
  - Do not automatically replace old finance methods one-for-one: accrual API semantics require explicit aggregation validation.
  - Keep unknown accrual identifiers fail-visible; never silently drop them from totals.
  - Prefer a current official Ozon Swagger browser export before final production schema migration; otherwise retain pinned mirror provenance.
