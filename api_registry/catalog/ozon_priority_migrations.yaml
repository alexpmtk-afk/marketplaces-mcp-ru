project_catalog_quality_findings:
  - finding: Several auto-imported Ozon operations are explicitly marked UNVERIFIED in ozon_mcp/endpoints.yaml.
    implication: They must not be promoted to authoritative API-registry records until matched to the pinned/current OpenAPI operation and request schema.
  - finding: HTTP POST is not evidence of a mutating Ozon operation.
    implication: Ozon OpenAPI contains many read-only operations implemented as POST; safety classification must be derived from operation semantics, not HTTP verb alone.

rules:
  - Do not automatically replace old finance methods one-for-one: new accrual API returns different semantics and requires explicit aggregation/mapping validation.
  - Keep unknown accrual identifiers fail-visible; never silently drop them from totals.
  - Before production migration, prefer a current official Ozon Swagger browser export; if unavailable, pin exact mirror commit/checksum and mark schema details provisional until official capture is stored.
  - Do not infer read/write safety from POST. Verify each Ozon operation from OpenAPI description and semantics.
