policy_candidate:
  - Generic schema-driven tools should reject a blocklisted operation_id with a structured retired_endpoint response and replacement metadata rather than attempt an upstream request.
  - Specialized tools must not route through a blocklisted endpoint.
  - A retired entry may remain in historical inventory for provenance, but must not be executable after its shutdown/removal is verified.
  - Production adoption requires tests and an explicit canonical app change after the active limiter/range task is complete.
