registry_version: 0.1-research
marketplace: wildberries
updated_at: 2026-09-04

operations:
  - operation_id: wb_stats_orders
    method: GET
    host: statistics-api.wildberries.ru
    path: /api/v1/supplier/orders
    section: statistics
    safety: read
    project_catalog:
      rate_limit: 1 req/min
      pagination: lastchangedate
      params:
        - dateFrom
        - flag
    semantics:
      flag_1: exact_calendar_date_mode
      flag_0: incremental_from_lastChangeDate
      max_rows_observed_from_official_docs: 80000
      retention_days: 90
      freshness_minutes_approx: 30
    optimization:
      single_day: flag_1
      short_multi_day: >-
        Prefer one flag=0 upstream request from the range start and aggregate by the
        actual order date when the response is complete and below the continuation
        boundary. Do not silently return partial totals.
    mcp:
      preferred_tool: wb_get_orders_summary
      generic_fallback_for_daily_summary: forbidden
    verification:
      status: official_docs_verified_for_core_semantics
      verified_at: 2026-09-04
      source: wb_official_docs

  - operation_id: wb_stats_sales
