  - operation_id: wb_report_realization
    method: GET
    host: statistics-api.wildberries.ru
    path: /api/v5/supplier/reportDetailByPeriod
    section: statistics
    safety: read
    project_catalog:
      rate_limit: 1 req/min
      pagination: rrdid
      params:
        - dateFrom
        - dateTo
        - limit
        - rrdid
    optimization:
      notes: >-
        This method is structurally different from Statistics Orders because it has
        an explicit dateTo and a financial-report cursor. Do not reuse the orders
        range strategy blindly.
    verification:
      status: project_inventory_pending_full_official_recheck
      verified_at: 2026-09-04
      source: wb_project_catalog

rate_limit_audit:
  issue: >-
    The current MCP limiter must not assume that operations with the same host,
    scope and textual rate limit necessarily share one quota. Quota grouping must
    be derived from explicit official documentation.
  operations_requiring_group_scope_verification:
    - wb_stats_orders
    - wb_stats_sales
    - wb_stats_stocks
    - wb_stats_incomes
    - wb_report_realization
  expected_safe_default_until_verified: per_operation_id
