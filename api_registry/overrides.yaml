      current_project_path_status: obsolete
      replacement_path: /v4/posting/fbs/list
      priority: critical
      migration_required_before_normal_use: true
    migration_notes:
      response_shape_changed: true
      pagination_changed: true
      notes: v4 postings are top-level and use cursor/has_next semantics rather than the v3 result.postings offset contract; verify against current Swagger before implementation.

  ozon:ozon_fbo_list:
