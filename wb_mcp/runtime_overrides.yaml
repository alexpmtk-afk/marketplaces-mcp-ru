# Live-runtime corrections that must take effect before the generated API
# inventory is refreshed. Keep this file intentionally small and evidence-based.
remove:
  - wb_stats_stocks
  - wb_report_realization
  - wb_adv_fullstats

endpoints:
  - operation_id: wb_analytics_stocks_wb_warehouses
    section: analytics
    method: POST
    host: seller-analytics-api.wildberries.ru
    path: /api/analytics/v1/stocks-report/wb-warehouses
    scope: analytics
    safety: read
    pagination: offset
    rate_limit: 3 req/min
    quota_proven: true
    summary: Current inventory by item size and WB warehouse; replaces retired /api/v1/supplier/stocks.
    params:
      body: '{nmIds[]<=1000, chrtIds[], limit<=250000, offset}'
    doc: https://dev.wildberries.ru/docs/openapi/analytics#tag/Istoriya-ostatkov/operation/postV1StocksReportWbWarehouses
    keywords:
      - остатки
      - склад
      - сток
      - наличие
      - история остатков
    items_path: data.items

  - operation_id: wb_get_api_advert_adverts
    section: promotion
    method: GET
    host: advert-api.wildberries.ru
    path: /api/advert/v2/adverts
    scope: promotion
    safety: read
    pagination: none
    rate_limit: 5 req/sec
    quota_proven: true
    summary: Current WB Promotion campaigns filtered by ids, statuses and payment model.
    params:
      query: 'ids CSV <=50; statuses CSV (-1,4,7,8,9,11); payment_type=cpm|cpc'
    doc: https://dev.wildberries.ru/docs/openapi/promotion
    keywords:
      - реклама
      - кампании
      - активные кампании
      - продвижение
    items_path: adverts

  - operation_id: wb_get_adv_fullstats
    section: promotion
    method: GET
    host: advert-api.wildberries.ru
    path: /adv/v3/fullstats
    scope: promotion
    safety: read
    pagination: none
    rate_limit: 3 req/min
    quota_proven: true
    summary: Current WB Promotion statistics for up to 50 campaigns and at most 31 calendar days.
    params:
      query: 'ids CSV <=50, beginDate YYYY-MM-DD, endDate YYYY-MM-DD; campaigns statuses 7,9,11'
      quota_note: 'Personal/Service/Base-with-secret: 3/min; Base token may be slower.'
    doc: https://dev.wildberries.ru/docs/openapi/promotion
    keywords:
      - реклама
      - статистика рекламы
      - fullstats
      - показы
      - клики
      - заказы
      - расход

  - operation_id: wb_get_adv_start
    section: promotion-control
    method: GET
    host: advert-api.wildberries.ru
    path: /adv/v0/start
    scope: promotion
    safety: write
    pagination: none
    rate_limit: 5 req/sec
    quota_proven: true
    summary: Start a WB Promotion campaign. Mutates campaign state despite HTTP GET.
    params:
      query: 'id campaign ID'
    doc: https://dev.wildberries.ru/docs/openapi/promotion

  - operation_id: wb_get_adv_pause
    section: promotion-control
    method: GET
    host: advert-api.wildberries.ru
    path: /adv/v0/pause
    scope: promotion
    safety: write
    pagination: none
    rate_limit: 5 req/sec
    quota_proven: true
    summary: Pause an active WB Promotion campaign. Mutates campaign state despite HTTP GET.
    params:
      query: 'id campaign ID'
    doc: https://dev.wildberries.ru/docs/openapi/promotion

  - operation_id: wb_get_adv_stop
    section: promotion-control
    method: GET
    host: advert-api.wildberries.ru
    path: /adv/v0/stop
    scope: promotion
    safety: write
    pagination: none
    rate_limit: 5 req/sec
    quota_proven: true
    summary: Stop/complete a WB Promotion campaign. Mutates campaign state despite HTTP GET.
    params:
      query: 'id campaign ID'
    doc: https://dev.wildberries.ru/docs/openapi/promotion

  - operation_id: wb_get_adv_delete
    section: promotion-control
    method: GET
    host: advert-api.wildberries.ru
    path: /adv/v0/delete
    scope: promotion
    safety: destructive
    pagination: none
    rate_limit: 5 req/sec
    quota_proven: true
    summary: Delete a WB Promotion campaign. Destructive despite HTTP GET.
    params:
      query: 'id campaign ID'
    doc: https://dev.wildberries.ru/docs/openapi/promotion

  - operation_id: wb_finance_sales_reports_list
    section: finance
    method: POST
    host: finance-api.wildberries.ru
    path: /api/finance/v1/sales-reports/list
    scope: finance
    safety: read
    pagination: offset
    rate_limit: 1 req/min
    quota_proven: true
    summary: List realization sales reports. Available since 2025-01-01; Personal or Service Finance token required.
    params:
      body: '{dateFrom, dateTo, period=weekly|daily, limit<=1000, offset}'
      token_types: [personal, service]
    doc: https://dev.wildberries.ru/docs/openapi/financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsList
    keywords:
      - реализация
      - финансовые отчёты
      - еженедельный отчёт
      - weekly report
      - список отчётов

  - operation_id: wb_finance_sales_reports_detailed_by_id
    section: finance
    method: POST
    host: finance-api.wildberries.ru
    path: /api/finance/v1/sales-reports/detailed/{reportId}
    scope: finance
    safety: read
    pagination: rrdid
    rate_limit: 1 req/min
    quota_proven: true
    summary: Realization report details by reportId. Available since 2025-01-01; Personal or Service Finance token required.
    params:
      path: '{reportId: int64}'
      body: '{limit<=100000, rrdId=0, fields[] optional; omit fields to return all fields}'
      token_types: [personal, service]
    doc: https://dev.wildberries.ru/docs/openapi/financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId
    keywords:
      - реализация
      - детализация
      - финансовый отчёт
      - reportId
      - rrdId

  - operation_id: wb_finance_sales_reports_detailed_period
    section: finance
    method: POST
    host: finance-api.wildberries.ru
    path: /api/finance/v1/sales-reports/detailed
    scope: finance
    safety: read
    pagination: rrdid
    rate_limit: 1 req/min
    quota_proven: false
    summary: Realization report details for a period. Current replacement for retired /api/v5/supplier/reportDetailByPeriod; quota depends on WB token type.
    params:
      body: '{dateFrom, dateTo, period=weekly|daily, limit<=100000, rrdId=0, fields[] optional}'
      quota_note: 'Personal, Service and Base-with-secret: 1/min; Base: 2 requests/24h with 12h interval.'
    doc: https://dev.wildberries.ru/docs/openapi/financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed
    keywords:
      - реализация
      - детализация
      - финансовый отчёт
      - период
      - rrdId

  - operation_id: wb_finance_balance
    section: finance
    method: GET
    host: finance-api.wildberries.ru
    path: /api/v1/account/balance
    scope: finance
    safety: read
    pagination: none
    rate_limit: 1 req/min
    quota_proven: false
    summary: Seller balance from the current Finance API host; quota depends on WB token type.
    params:
      quota_note: 'Personal, Service and Base-with-secret: 1/min; Base: 1 request/24h.'
    doc: https://dev.wildberries.ru/docs/openapi/financial-reports-and-accounting#tag/balance/operation/getV1AccountBalance
    keywords:
      - баланс
      - деньги
      - финансы
