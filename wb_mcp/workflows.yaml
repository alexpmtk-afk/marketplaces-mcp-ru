# Wildberries analytical workflows — curated recipes over the live catalog.
# Statistics sales/orders and manager endpoints are live-verified; current WB
# warehouse inventory moved to Seller Analytics in June 2026.

workflows:
  - name: sales_pulse
    category: analytics
    when_to_use: See recent sales, orders and returns to gauge momentum.
    steps:
      - operation_id: wb_stats_orders
        why: Orders since a date (incremental by lastChangeDate).
      - operation_id: wb_stats_sales
        why: Sales and returns since the same date.
    interpret: >
      Compare orders vs sales to spot a buyout gap. Statistics endpoints are
      rate-limited to 1 req/min — use wb_fetch_all which paces the date cursor.
    common_mistakes:
      - Hammering the endpoint — 1 req/min limit, expect slow walks.
      - Confusing order date with change date (the flag parameter controls it).

  - name: weekly_finance_archive
    category: finance
    when_to_use: Find the newest completed weekly realization report and archive its full row-level details.
    steps:
      - operation_id: wb_finance_sales_reports_list
        why: Request period=weekly, sort/select the newest returned report by report period/create date, and keep its reportId.
      - operation_id: wb_finance_sales_reports_detailed_by_id
        why: Download the selected report by reportId with limit<=100000 and rrdId continuation; omit fields to preserve every WB column.
    interpret: >
      Both methods use finance-api.wildberries.ru and require a Personal or
      Service token with the Finance category. Start details with rrdId=0 and
      continue from the rrdId of the last returned row until WB returns 204.
      The endpoint limit is one request per minute per seller account, so an
      archive worker should persist the cursor and resume instead of creating a
      hidden interactive wait. Data by report ID is available from 2025-01-01.
    common_mistakes:
      - Calling retired GET /api/v5/supplier/reportDetailByPeriod; WB disabled it on 2026-07-15.
      - Sending a Base token to list/by-ID methods; WB documents only Personal and Service tokens for them.
      - Passing fields when the archive goal is lossless; omit fields to receive all columns.
      - Assuming one page is complete without following rrdId until the terminal 204 response.

  - name: stock_health
    category: warehouse
    when_to_use: Check current stock and warehouse remains to avoid stockouts.
    steps:
      - operation_id: wb_analytics_stocks_wb_warehouses
        why: Current inventory by size and WB warehouse; refreshed about every 30 minutes.
      - operation_id: wb_analytics_warehouse_remains
        why: Detailed warehouse-remains report (async — returns a task_id to poll).
    interpret: >
      wb_analytics_stocks_wb_warehouses is the current point-in-time inventory
      source. It uses offset pagination and is limited to 3 requests/minute. The
      separate warehouse-remains report is async: create it, poll status, then
      download when a report-style export is needed.
    common_mistakes:
      - Calling the retired /api/v1/supplier/stocks Statistics endpoint.
      - Expecting historical daily stock from the current-inventory response.

  - name: price_audit
    category: pricing
    when_to_use: Review current prices and discounts across the catalog.
    steps:
      - operation_id: wb_prices_list
        why: Products with current price and discount (offset pagination).
    interpret: >
      Check for products in price quarantine (a new price 3x below the old one
      triggers it). Use wb_fetch_all for the full list.
    common_mistakes:
      - Setting a price 3x below the old one — it lands in quarantine, not live.

  - name: reorder_planner
    category: warehouse
    when_to_use: Decide what to resupply — compute days-of-cover from sales velocity vs current stock.
    steps:
      - operation_id: wb_stats_sales
        why: Sales over a window to compute average daily sales (ADS) per nmId.
      - operation_id: wb_analytics_stocks_wb_warehouses
        why: Current available quantity per nmId, size and WB warehouse.
    interpret: >
      Per nmId: ADS = (count of sale rows in window) / (days in window). Join
      sales to current inventory by nmId and aggregate `quantity` across the
      required sizes/warehouses. Days-of-cover = sellable stock / ADS. Flag SKUs
      where cover < lead time + safety buffer. `inWayToClient`/`inWayFromClient`
      are in transit — not yet sellable, so do not count them as cover. Sales are
      limited to 1 req/min; current inventory to 3 req/min with offset pagination.
    common_mistakes:
      - Counting in-transit units as available cover.
      - Forgetting to aggregate size/warehouse rows before computing cover per nmId.
      - Using too short a sales window — ADS gets noisy under ~14 days.

  - name: abc_analysis
    category: analytics
    when_to_use: Rank products A/B/C by revenue contribution to focus attention.
    steps:
      - operation_id: wb_stats_sales
        why: Sale rows with revenue fields per nmId over the period.
    interpret: >
      Sum `finishedPrice` (buyer-paid, all discounts except WB Wallet) per nmId for
      gross revenue, or `forPay` for net-to-seller. Sort descending, take cumulative
      share: A = top SKUs up to 80% of revenue, B = next 15%, C = last 5%. A-items
      deserve stock priority and ad spend; C-items are candidates to delist.
    common_mistakes:
      - Mixing forPay (net) and finishedPrice (gross) in the same ranking.
      - Ranking by unit count instead of revenue.

  - name: reviews_pulse
    category: communications
    when_to_use: Triage customer feedback and unanswered questions.
    steps:
      - operation_id: wb_get_api_feedbacks
        why: Feedbacks; filter isAnswered=false to find what needs a reply.
      - operation_id: wb_get_api_questions
        why: Buyer questions; unanswered ones hurt conversion if left hanging.
    interpret: >
      Both take isAnswered (bool), take (<=5000) and skip for paging. Prioritise
      unanswered + low-star feedbacks. Cluster recurring complaints by nmId — a
      repeated theme on one card is a product/content fix, not a one-off reply.
    common_mistakes:
      - Forgetting take/skip — the endpoints page, default window is small.
