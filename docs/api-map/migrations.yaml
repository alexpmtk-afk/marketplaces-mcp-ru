controls:
  - id: no_expired_preferred_route
    rule: A route whose cutoff_date is before today must not remain a preferred user-facing route.
  - id: migration_requires_schema_update
    rule: Version migration must update request, response, items_path and pagination metadata together; path-only replacement is forbidden.
  - id: official_confirmation_gate
    rule: Production code changes require an authoritative source or verified runtime evidence; discovery-only mirrors are insufficient by themselves.
